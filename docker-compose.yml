# Project Dominion — local development stack.
#
# The host may lack pdo_pgsql, so this is the canonical development environment:
# migrations, PostGIS work and anything database-shaped runs in here.
#
#   make setup    build, install, migrate, seed
#   make dev      start
#
# Inside the network use service names (postgres, redis). From the host use
# localhost and the published ports below.

name: dominion

services:
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api/Dockerfile
      target: development
    volumes:
      - ./apps/api:/app
      - ./packages:/packages
      - api-vendor:/app/vendor
    ports:
      - "8080:8000"
    environment:
      APP_ENV: local
      DB_HOST: postgres
      REDIS_HOST: redis
      REVERB_HOST: reverb
    env_file:
      - path: ./apps/api/.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  postgres:
    # PostGIS is not optional — the world map depends on it (ADR-004). Using the
    # postgis image rather than plain postgres means the extension can never be
    # missing in a way that only shows up in production.
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: dominion
      POSTGRES_USER: dominion
      POSTGRES_PASSWORD: dominion
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dominion -d dominion"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  horizon:
    build:
      context: .
      dockerfile: infrastructure/docker/api/Dockerfile
      target: development
    command: php artisan horizon
    volumes:
      - ./apps/api:/app
      - api-vendor:/app/vendor
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    env_file:
      - path: ./apps/api/.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # `horizon:status` prints "Horizon is running." and exits 0 only when the
      # master supervisor is up; a paused or crashed Horizon fails the grep.
      test: ["CMD-SHELL", "php artisan horizon:status | grep -q running"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  reverb:
    build:
      context: .
      dockerfile: infrastructure/docker/api/Dockerfile
      target: development
    command: php artisan reverb:start --host=0.0.0.0 --port=8081
    volumes:
      - ./apps/api:/app
      - api-vendor:/app/vendor
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    env_file:
      - path: ./apps/api/.env
        required: false
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 8081) ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dominion
      MINIO_ROOT_PASSWORD: dominion-secret
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
  api-vendor:
