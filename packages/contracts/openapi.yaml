openapi: 3.1.0

info:
  title: Project Dominion API
  version: 0.1.0
  description: |
    The contract between the Laravel API and the React Native client.

    **This file is the source of truth.** TypeScript types are generated from it
    (`npm run contracts:generate`) and CI fails if they drift. Backend contract
    tests assert that real responses validate against these schemas.

    Write the spec before the implementation — see ADR-017.

servers:
  - url: http://localhost:8080/api/v1
    description: Local (Docker)

tags:
  - name: Platform
    description: Health and metadata

paths:
  /health:
    get:
      tags: [Platform]
      summary: Liveness and readiness
      description: |
        Unauthenticated and cheap — polled by the load balancer and by the
        client's connectivity banner. Reports dependency status and the three
        content versions the client pins against (ADR-015).
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Healthy
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/HealthData'
                  meta:
                    $ref: '#/components/schemas/HealthMeta'
        '503':
          description: One or more dependencies are down
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/HealthData'
                  meta:
                    $ref: '#/components/schemas/HealthMeta'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login with email and password
      operationId: authLogin
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Logged in successfully
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/guest:
    post:
      tags: [Auth]
      summary: Start a guest session
      operationId: authGuest
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Guest session created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AuthTokens'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh tokens
      operationId: authRefresh
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/social:
    post:
      tags: [Auth]
      summary: Sign in with a verified Apple or Google identity
      operationId: authSocial
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, identity_token]
              additionalProperties: false
              properties:
                provider:
                  type: string
                  enum: [apple, google]
                identity_token:
                  type: string
      responses:
        '200':
          description: Signed in successfully
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AuthTokens'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/upgrade:
    post:
      tags: [Auth]
      summary: Upgrade a guest account without changing its id
      operationId: authUpgrade
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [email, password]
                  additionalProperties: false
                  properties:
                    email:
                      type: string
                      format: email
                    password:
                      type: string
                      minLength: 8
                - type: object
                  required: [provider, identity_token]
                  additionalProperties: false
                  properties:
                    provider:
                      type: string
                      enum: [apple, google]
                    identity_token:
                      type: string
      responses:
        '200':
          description: Guest account upgraded
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout and revoke access token
      operationId: authLogout
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {}
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/sessions:
    get:
      tags: [Auth]
      summary: List active device sessions
      operationId: authListSessions
      responses:
        '200':
          description: Sessions listed successfully
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeviceSession'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/sessions/{id}:
    delete:
      tags: [Auth]
      summary: Revoke a device session
      operationId: authRevokeSession
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      responses:
        '200':
          description: Session revoked successfully
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {}
        '401':
          $ref: '#/components/responses/Unauthorized'

  /game/bootstrap:
    post:
      tags: [Game]
      summary: Create or restore the player's starter city
      operationId: gameBootstrap
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameBootstrapRequest'
      responses:
        '201':
          description: Starter game state created or restored
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/GameBootstrap'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /game/worlds:
    get:
      tags: [Game]
      summary: List worlds available for onboarding
      operationId: gameWorlds
      responses:
        '200':
          description: World population and availability
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/WorldList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /game/worlds/{worldId}/select:
    post:
      tags: [Game]
      summary: Join an open world and create the starter city
      operationId: gameWorldSelect
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: worldId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Ulid'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 24
      responses:
        '201':
          description: World membership and starter city created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/GameBootstrap'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          description: The selected world is closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /game/city:
    get:
      tags: [Game]
      summary: Read the authoritative city state
      operationId: gameCity
      responses:
        '200':
          description: Current city state
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/CityData'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /game/world:
    get:
      tags: [Game]
      summary: Read the bounded world view around the player's city
      operationId: gameWorld
      responses:
        '200':
          description: Current world view
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/WorldData'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /game/world/viewport:
    get:
      tags: [Game]
      summary: Read a bounded persisted world viewport
      operationId: gameWorldViewport
      parameters:
        - name: min_x
          in: query
          required: true
          schema:
            type: integer
        - name: max_x
          in: query
          required: true
          schema:
            type: integer
        - name: min_y
          in: query
          required: true
          schema:
            type: integer
        - name: max_y
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Persisted terrain tiles in the requested bounds
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/WorldViewport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /game/military:
    get:
      tags: [Game]
      summary: Read the player's server-authoritative military overview
      operationId: gameMilitary
      responses:
        '200':
          description: Current military overview
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/MilitaryData'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /game/alliance:
    get:
      tags: [Game]
      summary: Read the player's alliance membership
      operationId: gameAlliance
      responses:
        '200':
          description: Current alliance overview
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AllianceData'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Game]
      summary: Create an alliance and become its leader
      operationId: gameCreateAlliance
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAllianceRequest'
      responses:
        '201':
          description: Alliance created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AllianceData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /game/city/buildings/{code}/upgrade:
    post:
      tags: [Game]
      summary: Start a server-computed building upgrade
      operationId: gameUpgradeBuilding
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Construction started
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [construction]
                    properties:
                      construction:
                        $ref: '#/components/schemas/Construction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
components:
  headers:
    XRequestId:
      description: Correlation id, echoed from the request or generated.
      schema:
        type: string

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated ULID or UUID, unique per logical operation — **not**
        per retry. A retry reuses the same key. See docs/api/idempotency.md.
      schema:
        type: string
        minLength: 16
        maxLength: 64

    ClientVersion:
      name: X-Client-Version
      in: header
      required: false
      schema:
        type: string

    ClientPlatform:
      name: X-Client-Platform
      in: header
      required: false
      schema:
        type: string
        enum: [ios, android]

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Sanctum access token. See docs/api/authentication.md.

  schemas:
    AuthTokens:
      type: object
      required: [access_token, refresh_token]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string

    DeviceSession:
      type: object
      required: [id, device_name, platform, ip, last_seen_at]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        device_name:
          type: string
        platform:
          type: string
        ip:
          type: string
        last_seen_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true

    Player:
      type: object
      required: [id, name, world_id]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
        world_id:
          $ref: '#/components/schemas/Ulid'

    GameBootstrapRequest:
      type: object
      additionalProperties: false
      properties:
        world_id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
          minLength: 3
          maxLength: 24

    WorldOption:
      type: object
      required: [id, code, name, population, capacity, status, has_player]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        code:
          type: string
        name:
          type: string
        population:
          type: integer
          minimum: 0
        capacity:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [open, full, closed]
        has_player:
          type: boolean

    WorldList:
      type: object
      required: [worlds]
      properties:
        worlds:
          type: array
          items:
            $ref: '#/components/schemas/WorldOption'

    World:
      type: object
      required: [id, code, name]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        code:
          type: string
        name:
          type: string

    CityIdentity:
      type: object
      required: [id, name_key, x, y]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        name_key:
          type: string
        x:
          type: integer
        y:
          type: integer

    CityResources:
      type: object
      required: [current, capacity]
      properties:
        current:
          $ref: '#/components/schemas/ResourceBundle'
        capacity:
          $ref: '#/components/schemas/ResourceBundle'

    CityBuilding:
      type: object
      required: [code, name_key, category, level, max_level, next_level_cost, build_time_seconds]
      properties:
        code:
          type: string
        name_key:
          type: string
        category:
          type: string
        level:
          type: integer
        max_level:
          type: integer
        next_level_cost:
          $ref: '#/components/schemas/ResourceBundle'
        build_time_seconds:
          type: integer

    Construction:
      type: object
      required: [id, building_code, from_level, target_level, started_at, finishes_at]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        building_code:
          type: string
        from_level:
          type: integer
        target_level:
          type: integer
        started_at:
          type: string
          format: date-time
        finishes_at:
          type: string
          format: date-time

    GameBootstrap:
      type: object
      required: [player, world, city, versions, realtime]
      properties:
        player:
          $ref: '#/components/schemas/Player'
        world:
          $ref: '#/components/schemas/World'
        city:
          $ref: '#/components/schemas/CityIdentity'
        versions:
          type: object
          required: [data, economy, combat]
          properties:
            data: { type: integer }
            economy: { type: integer }
            combat: { type: integer }
        realtime:
          type: object
          required: [key, host, port, scheme, auth_endpoint]
          properties:
            key: { type: string }
            host: { type: string }
            port: { type: integer }
            scheme: { type: string, enum: [http, https] }
            auth_endpoint: { type: string, format: uri }

    CityData:
      type: object
      required: [player, world, city, resources, buildings, construction, server_time]
      properties:
        player:
          $ref: '#/components/schemas/Player'
        world:
          $ref: '#/components/schemas/World'
        city:
          $ref: '#/components/schemas/CityIdentity'
        resources:
          $ref: '#/components/schemas/CityResources'
        buildings:
          type: array
          items:
            $ref: '#/components/schemas/CityBuilding'
        construction:
          oneOf:
            - $ref: '#/components/schemas/Construction'
            - type: 'null'
        server_time:
          type: string
          format: date-time

    WorldMapCity:
      type: object
      required: [id, name_key, x, y, is_player_city]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        name_key:
          type: string
        x:
          type: integer
        y:
          type: integer
        is_player_city:
          type: boolean

    WorldData:
      type: object
      required: [player, world, center, radius, cities, server_time]
      properties:
        player:
          $ref: '#/components/schemas/Player'
        world:
          $ref: '#/components/schemas/World'
        center:
          type: object
          required: [x, y]
          properties:
            x: { type: integer }
            y: { type: integer }
        radius:
          type: integer
          minimum: 0
        cities:
          type: array
          items:
            $ref: '#/components/schemas/WorldMapCity'
        server_time:
          type: string
          format: date-time

    WorldTile:
      type: object
      required: [id, region_id, x, y, terrain]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        region_id:
          $ref: '#/components/schemas/Ulid'
        x:
          type: integer
        y:
          type: integer
        terrain:
          type: string
          enum: [plains, forest, hills, mountains, river, road]

    WorldViewport:
      type: object
      required: [player, world, bounds, tiles]
      properties:
        player:
          $ref: '#/components/schemas/Player'
        world:
          $ref: '#/components/schemas/World'
        bounds:
          type: object
          required: [min_x, max_x, min_y, max_y]
          properties:
            min_x: { type: integer }
            max_x: { type: integer }
            min_y: { type: integer }
            max_y: { type: integer }
        tiles:
          type: array
          items:
            $ref: '#/components/schemas/WorldTile'

    MilitaryUnit:
      type: object
      required: [code, name_key, unit_class, quantity, power_per_unit, total_power]
      properties:
        code:
          type: string
        name_key:
          type: string
        unit_class:
          type: string
        quantity:
          type: integer
          minimum: 0
        power_per_unit:
          type: integer
          minimum: 0
        total_power:
          type: integer
          minimum: 0

    MilitaryData:
      type: object
      required: [player, world, city, units, total_power, server_time]
      properties:
        player:
          $ref: '#/components/schemas/Player'
        world:
          $ref: '#/components/schemas/World'
        city:
          type: object
          required: [id, name_key]
          properties:
            id:
              $ref: '#/components/schemas/Ulid'
            name_key:
              type: string
        units:
          type: array
          items:
            $ref: '#/components/schemas/MilitaryUnit'
        total_power:
          type: integer
          minimum: 0
        server_time:
          type: string
          format: date-time

    AllianceSummary:
      type: object
      required: [id, name, tag, role, member_count, max_members]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
        tag:
          type: string
        role:
          type: string
        member_count:
          type: integer
          minimum: 0
        max_members:
          type: integer
          minimum: 1

    AllianceMember:
      type: object
      required: [player_id, player_name, role]
      properties:
        player_id:
          $ref: '#/components/schemas/Ulid'
        player_name:
          type: string
        role:
          type: string

    AllianceData:
      type: object
      required: [player, world, alliance, members, can_create, server_time]
      properties:
        player:
          $ref: '#/components/schemas/Player'
        world:
          $ref: '#/components/schemas/World'
        alliance:
          oneOf:
            - $ref: '#/components/schemas/AllianceSummary'
            - type: 'null'
        members:
          type: array
          items:
            $ref: '#/components/schemas/AllianceMember'
        can_create:
          type: boolean
        server_time:
          type: string
          format: date-time

    CreateAllianceRequest:
      type: object
      required: [name, tag]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 32
        tag:
          type: string
          minLength: 2
          maxLength: 5

    Ulid:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
      description: Non-enumerable, time-sortable identifier (ADR-016).

    ResourceType:
      type: string
      enum: [food, wood, stone, iron, gold]

    ResourceBundle:
      type: object
      description: |
        Whole units only — never fractional (ADR-010). Absent keys are zero.
      additionalProperties: false
      properties:
        food: { type: integer, minimum: 0 }
        wood: { type: integer, minimum: 0 }
        stone: { type: integer, minimum: 0 }
        iron: { type: integer, minimum: 0 }
        gold: { type: integer, minimum: 0 }

    ContentVersions:
      type: object
      required: [data, combat, economy]
      description: |
        Independent version counters. A client that does not understand the
        current rules should prompt an update rather than misrender (ADR-015).
      properties:
        data: { type: integer }
        combat: { type: integer }
        economy: { type: integer }

    HealthData:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          additionalProperties:
            type: boolean

    HealthMeta:
      type: object
      required: [game, environment, server_time, versions]
      properties:
        game: { type: string }
        environment: { type: string }
        server_time:
          type: string
          format: date-time
          description: UTC, ISO-8601 with explicit offset. The device clock is never authoritative.
        versions:
          $ref: '#/components/schemas/ContentVersions'

    Pagination:
      type: object
      description: Cursor-based — the world changes under the reader.
      properties:
        next_cursor:
          type: [string, 'null']
        has_more:
          type: boolean

    ErrorCode:
      type: string
      description: |
        The machine-readable failure catalogue. **The client branches on this,
        never on `message`.** Codes are frozen once shipped; clients must also
        handle unknown codes with a default branch, since new codes are additive
        and not a breaking change (docs/api/versioning.md).

        Mirrors `Game\Shared\Application\Error\ErrorCode`.
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - RATE_LIMITED
        - SERVER_ERROR
        - SERVICE_UNAVAILABLE
        - UNSUPPORTED_CLIENT_VERSION
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_KEY_REUSED
        - IDEMPOTENCY_REQUEST_IN_FLIGHT
        - INVALID_CREDENTIALS
        - ACCOUNT_BANNED
        - ACCOUNT_SUSPENDED
        - DEVICE_SESSION_REVOKED
        - TOKEN_EXPIRED
        - GUEST_UPGRADE_REQUIRED
        - INSUFFICIENT_RESOURCES
        - WAREHOUSE_CAPACITY_EXCEEDED
        - LEDGER_IMBALANCE
        - CITY_BUSY
        - CITY_NOT_OWNED
        - BUILDING_MAX_LEVEL
        - BUILDING_REQUIREMENTS_NOT_MET
        - BUILD_QUEUE_FULL
        - BUILDING_SLOT_OCCUPIED
        - RESEARCH_IN_PROGRESS
        - TECHNOLOGY_LOCKED
        - TECHNOLOGY_MAX_LEVEL
        - MARCH_LIMIT_REACHED
        - ARMY_ALREADY_DEPLOYED
        - INSUFFICIENT_TROOPS
        - INVALID_TARGET
        - TARGET_OUT_OF_RANGE
        - MARCH_NOT_CANCELLABLE
        - TROOP_CAPACITY_EXCEEDED
        - BATTLE_ALREADY_RESOLVED
        - SIMULATION_VERSION_MISMATCH
        - PLAYER_PROTECTED
        - ATTACKER_PROTECTED
        - POWER_DIFFERENCE_TOO_LARGE
        - BEGINNER_ZONE_RESTRICTED
        - ALLIANCE_PERMISSION_DENIED
        - ALLIANCE_FULL
        - ALREADY_IN_ALLIANCE
        - NOT_IN_ALLIANCE
        - ALLIANCE_NAME_TAKEN
        - MARKET_ORDER_UNAVAILABLE
        - TRADE_ROUTE_BUSY
        - TRADE_LIMIT_REACHED
        - TILE_OCCUPIED
        - TILE_NOT_SETTLEABLE
        - WORLD_CLOSED
        - WORLD_FULL
        - CHAT_MUTED
        - CONTENT_REJECTED
        - RECIPIENT_BLOCKED
        - FEATURE_DISABLED
        - EVENT_NOT_ACTIVE
        - REWARD_ALREADY_CLAIMED
        - PURCHASE_VERIFICATION_FAILED

    ErrorResponse:
      type: object
      required: [error]
      description: |
        The only failure shape. Produced by
        `Game\Shared\Interface\Http\ApiResponse::error()`.
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: For developers and logs. Localised copy lives on the client, keyed by `code`.
            details:
              type: object
              additionalProperties: true
            retryable:
              type: boolean
              description: Whether retrying the identical request could succeed.

  responses:
    BadRequest:
      description: The requested game action cannot be applied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, expired or revoked credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: No such resource, or not visible to this player
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationFailed:
      description: Invalid request payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: The requested state conflicts with the current game state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

security:
  - bearerAuth: []
